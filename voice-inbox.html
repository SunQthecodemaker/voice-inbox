<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보이스 인박스</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13; color: #e8e8f0;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 24px 16px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 28px; color: #c8c8e0; }
    .mic-area { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 28px; }
    #micBtn {
      width: 88px; height: 88px; border-radius: 50%; border: none;
      background: #1e1e2e; color: #7878b8; font-size: 2rem; cursor: pointer;
      transition: all 0.2s ease; box-shadow: 0 0 0 0 rgba(120,120,200,0);
    }
    #micBtn:hover { background: #252538; }
    #micBtn.recording {
      background: #2a1a2e; color: #d060d0;
      box-shadow: 0 0 0 8px rgba(200,80,200,0.12);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 8px rgba(200,80,200,0.12); }
      50% { box-shadow: 0 0 0 16px rgba(200,80,200,0.04); }
    }
    #micStatus { font-size: 0.82rem; color: #666680; height: 18px; }
    .text-input-row { display: flex; gap: 8px; width: 100%; max-width: 480px; margin-bottom: 28px; }
    #textInput {
      flex: 1; background: #1a1a28; border: 1px solid #2a2a40; border-radius: 10px;
      color: #e8e8f0; padding: 10px 14px; font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    #textInput:focus { border-color: #4a4a80; }
    #textInput::placeholder { color: #44446a; }
    #sendTextBtn {
      background: #252540; border: 1px solid #3a3a60; border-radius: 10px;
      color: #8888cc; padding: 10px 16px; font-size: 0.85rem; cursor: pointer;
      white-space: nowrap; transition: background 0.2s;
    }
    #sendTextBtn:hover { background: #2e2e50; }
    #preview {
      width: 100%; max-width: 480px; background: #1a1a28; border: 1px solid #2a2a40;
      border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; display: none;
    }
    .preview-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .preview-row.top-align { align-items: flex-start; }
    .preview-label { font-size: 0.72rem; color: #555578; width: 32px; flex-shrink: 0; padding-top: 4px; }
    .preview-title { font-size: 1rem; font-weight: 600; color: #d8d8f0; flex: 1; }
    .preview-title[contenteditable="true"] {
      outline: none; padding: 2px 6px; margin: -2px -6px; border-radius: 6px;
      transition: background 0.15s; cursor: text;
    }
    .preview-title[contenteditable="true"]:hover { background: #22223a; }
    .preview-title[contenteditable="true"]:focus { background: #22223a; box-shadow: 0 0 0 1px #4a4a80; }
    .preview-content {
      font-size: 0.85rem; color: #9090b0; line-height: 1.5;
      outline: none; padding: 6px 8px; margin: 0 -8px; border-radius: 6px;
      transition: background 0.15s; cursor: text;
      white-space: pre-wrap;
    }
    .preview-content[contenteditable="true"]:hover { background: #22223a; }
    .preview-content[contenteditable="true"]:focus { background: #22223a; box-shadow: 0 0 0 1px #4a4a80; }

    /* Area select */
    .area-select {
      appearance: none; -webkit-appearance: none; outline: none; cursor: pointer;
      border: none; border-radius: 14px; padding: 4px 22px 4px 12px;
      font-size: 0.78rem; font-weight: 500; font-family: inherit;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='%23888' d='M2 4l3 3 3-3z'/></svg>");
      background-repeat: no-repeat; background-position: right 6px center;
    }
    .area-select:focus { box-shadow: 0 0 0 2px rgba(120,120,200,0.3); }
    .area-select option { background: #1a1a28; color: #e8e8f0; }
    .area-병원 { background-color: #1e2a3e; color: #6090d0; }
    .area-개인업무 { background-color: #1e3a2e; color: #60c080; }
    .area-개인생활 { background-color: #2e2a1e; color: #c0a040; }

    /* Tag chips */
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; align-items: center; }
    .tag-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(176,128,208,0.12); border: 1px solid rgba(176,128,208,0.3);
      border-radius: 14px; padding: 3px 6px 3px 12px; font-size: 0.78rem;
      color: #b080d0;
    }
    .tag-chip-x {
      color: #6a6a8a; cursor: pointer; padding: 0 4px; font-weight: 400;
      line-height: 1; user-select: none;
    }
    .tag-chip-x:hover { color: #d07070; }
    .tag-add-input {
      background: transparent; border: 1px dashed #44446a; border-radius: 14px;
      padding: 3px 10px; font-size: 0.78rem; color: #e8e8f0;
      outline: none; min-width: 80px; max-width: 140px; font-family: inherit;
    }
    .tag-add-input::placeholder { color: #44446a; }
    .tag-add-input:focus { border-color: #6a6a8a; border-style: solid; }

    .append-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(80,180,120,0.12); border: 1px solid rgba(80,180,120,0.3);
      border-radius: 14px; padding: 4px 12px; font-size: 0.78rem; color: #50b478;
      margin-bottom: 12px;
    }
    .append-badge-x {
      color: #6a8a6a; cursor: pointer; padding: 0 4px; font-weight: 400; user-select: none;
    }
    .append-badge-x:hover { color: #d07070; }

    .preview-actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn-save {
      flex: 1; background: #252550; border: 1px solid #3a3a70; border-radius: 8px;
      color: #9090d0; padding: 9px; font-size: 0.85rem; cursor: pointer; transition: background 0.2s;
    }
    .btn-save:hover { background: #2e2e60; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-discard {
      background: #1e1e2e; border: 1px solid #2a2a40; border-radius: 8px;
      color: #555578; padding: 9px 14px; font-size: 0.85rem; cursor: pointer; transition: background 0.2s;
    }
    .btn-discard:hover { background: #252535; }
    #processing { font-size: 0.82rem; color: #666688; margin-bottom: 20px; display: none; }
    #toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #252540; border: 1px solid #3a3a60; border-radius: 10px;
      padding: 10px 20px; font-size: 0.85rem; color: #9090cc;
      transition: transform 0.3s ease; z-index: 100;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .section-title {
      width: 100%; max-width: 480px; font-size: 0.78rem; color: #44446a;
      letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px;
    }
    #savedList { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 8px; }
    .saved-item {
      background: #151520; border: 1px solid #222235; border-radius: 10px;
      padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px;
    }
    .saved-item-area {
      display: inline-block; padding: 2px 9px; border-radius: 12px;
      font-size: 0.7rem; font-weight: 500; flex-shrink: 0; margin-top: 2px;
    }
    .saved-item-text { flex: 1; min-width: 0; }
    .saved-item-title { font-size: 0.88rem; color: #c8c8e0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .saved-item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .saved-item-tag {
      font-size: 0.7rem; color: #8888aa; background: rgba(176,128,208,0.08);
      border-radius: 8px; padding: 1px 6px;
    }
    .saved-item-meta { font-size: 0.72rem; color: #44446a; margin-top: 4px; }
    #noSpeech { display: none; font-size: 0.82rem; color: #555570; text-align: center; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>보이스 인박스</h1>
  <div class="mic-area">
    <button id="micBtn" title="누르고 말하기">🎙️</button>
    <div id="micStatus">버튼을 눌러 음성 입력</div>
  </div>
  <div id="noSpeech">음성 인식이 지원되지 않는 브라우저입니다.<br>아래 텍스트 입력을 사용하세요.</div>
  <div class="text-input-row">
    <input id="textInput" type="text" placeholder="#그룹명 메모 또는 텍스트로 입력..." />
    <button id="sendTextBtn">분류 저장</button>
  </div>
  <div id="processing">분류 중...</div>
  <div id="preview">
    <div class="preview-row">
      <span class="preview-label">제목</span>
      <span id="prevTitle" class="preview-title" contenteditable="true" spellcheck="false"></span>
    </div>
    <div class="preview-row">
      <span class="preview-label">영역</span>
      <select id="selArea" class="area-select"></select>
    </div>
    <div class="preview-row top-align">
      <span class="preview-label">태그</span>
      <div id="tagsWrap" class="tags-wrap"></div>
    </div>
    <div id="appendBadge" class="append-badge" style="display:none"></div>
    <div id="prevContent" class="preview-content" contenteditable="true" spellcheck="false"></div>
    <div class="preview-actions">
      <button class="btn-save" id="saveBtn">vault에 저장</button>
      <button class="btn-discard" id="discardBtn">취소</button>
    </div>
  </div>
  <div class="section-title" id="listLabel" style="display:none">최근 항목</div>
  <div id="savedList"></div>
  <div id="toast"></div>

  <script>
    const API_BASE = 'https://chnqtrmlglqdmzqwsazm.supabase.co/functions/v1/voice-inbox';
    const AREAS = ['병원', '개인업무', '개인생활'];

    let currentData = null;
    let currentSource = 'text';
    let currentGroup = null;
    const savedItems = JSON.parse(localStorage.getItem('voiceInbox') || '[]');

    const micBtn = document.getElementById('micBtn');
    const micStatus = document.getElementById('micStatus');
    const textInput = document.getElementById('textInput');
    const sendTextBtn = document.getElementById('sendTextBtn');
    const processing = document.getElementById('processing');
    const preview = document.getElementById('preview');
    const prevTitle = document.getElementById('prevTitle');
    const selArea = document.getElementById('selArea');
    const tagsWrap = document.getElementById('tagsWrap');
    const prevContent = document.getElementById('prevContent');
    const saveBtn = document.getElementById('saveBtn');
    const discardBtn = document.getElementById('discardBtn');
    const savedList = document.getElementById('savedList');
    const listLabel = document.getElementById('listLabel');
    const toast = document.getElementById('toast');
    const noSpeech = document.getElementById('noSpeech');

    // Populate area select once
    selArea.innerHTML = AREAS.map(a => `<option value="${a}">${a}</option>`).join('');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        textInput.value = transcript;
        if (e.results[e.results.length - 1].isFinal) { stopRecording(); processText(transcript, 'voice'); }
      };
      recognition.onerror = () => { stopRecording(); micStatus.textContent = '인식 실패. 다시 시도하세요.'; };
      recognition.onend = () => { if (isRecording) stopRecording(); };
    } else {
      noSpeech.style.display = 'block';
      micBtn.style.opacity = '0.3';
      micBtn.disabled = true;
    }

    function startRecording() {
      if (!recognition) return;
      isRecording = true; micBtn.classList.add('recording');
      micStatus.textContent = '말하세요...'; textInput.value = ''; recognition.start();
    }
    function stopRecording() {
      isRecording = false; micBtn.classList.remove('recording');
      micStatus.textContent = '버튼을 눌러 음성 입력';
      try { recognition.stop(); } catch {}
    }
    micBtn.addEventListener('click', () => { if (isRecording) stopRecording(); else startRecording(); });
    sendTextBtn.addEventListener('click', () => { const t = textInput.value.trim(); if (t) processText(t, 'text'); });
    textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const t = textInput.value.trim(); if (t) processText(t, 'text'); } });

    async function processText(text, source) {
      currentSource = source || 'text';
      currentGroup = null;
      const groupMatch = text.match(/^#([^\s#]+)\s+/);
      if (groupMatch) {
        currentGroup = groupMatch[1];
        text = text.slice(groupMatch[0].length);
      }
      processing.style.display = 'block'; preview.style.display = 'none';
      try {
        const res = await fetch(`${API_BASE}/classify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (!res.ok) throw new Error('classify failed');
        const data = await res.json();
        currentData = {
          title: data.title || text.slice(0, 20),
          area: AREAS.includes(data.area) ? data.area : '병원',
          tags: Array.isArray(data.tags) ? data.tags.slice(0, 10) : [],
          content: data.summary || text,
          original: text,
        };
        showPreview();
      } catch {
        currentData = {
          title: text.length > 20 ? text.slice(0, 20) + '...' : text,
          area: '병원',
          tags: [],
          content: text,
          original: text,
        };
        showPreview();
      } finally { processing.style.display = 'none'; }
    }

    function showPreview() {
      prevTitle.textContent = currentData.title;
      prevContent.textContent = currentData.content;
      renderArea();
      renderTags();
      renderAppendBadge();
      preview.style.display = 'block';
    }

    function renderAppendBadge() {
      const badge = document.getElementById('appendBadge');
      if (currentGroup) {
        badge.innerHTML = '&#128206; <b>' + escapeHtml(currentGroup) + '</b>에 누적 <span class="append-badge-x" id="clearGroup">&times;</span>';
        badge.style.display = 'inline-flex';
        document.getElementById('clearGroup').addEventListener('click', () => {
          currentGroup = null;
          renderAppendBadge();
          saveBtn.textContent = 'vault에 저장';
        });
        saveBtn.textContent = currentGroup + '에 누적';
      } else {
        badge.style.display = 'none';
        saveBtn.textContent = 'vault에 저장';
      }
    }

    function renderArea() {
      selArea.value = currentData.area;
      selArea.className = 'area-select area-' + currentData.area;
    }
    selArea.addEventListener('change', () => {
      currentData.area = selArea.value;
      renderArea();
    });

    function renderTags() {
      const chips = currentData.tags.map((tag, i) =>
        `<span class="tag-chip" data-i="${i}">${escapeHtml(tag)}<span class="tag-chip-x" data-i="${i}">×</span></span>`
      ).join('');
      tagsWrap.innerHTML = chips +
        `<input id="tagAddInput" class="tag-add-input" placeholder="+ 태그" maxlength="30" />`;

      tagsWrap.querySelectorAll('.tag-chip-x').forEach(el => {
        el.addEventListener('click', () => {
          const i = parseInt(el.dataset.i, 10);
          currentData.tags.splice(i, 1);
          renderTags();
        });
      });
      const input = document.getElementById('tagAddInput');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const v = input.value.trim().replace(/,/g, '');
          if (v && !currentData.tags.includes(v) && currentData.tags.length < 10) {
            currentData.tags.push(v);
            renderTags();
            setTimeout(() => document.getElementById('tagAddInput')?.focus(), 0);
          }
        }
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    prevTitle.addEventListener('blur', () => {
      if (currentData) currentData.title = prevTitle.textContent.trim() || currentData.title;
    });
    prevTitle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); prevTitle.blur(); }
    });
    prevContent.addEventListener('blur', () => {
      if (currentData) currentData.content = prevContent.textContent.trim() || currentData.content;
    });

    saveBtn.addEventListener('click', async () => {
      if (!currentData) return;
      currentData.title = prevTitle.textContent.trim() || currentData.title;
      currentData.content = prevContent.textContent.trim() || currentData.content;

      const pendingTag = document.getElementById('tagAddInput')?.value.trim();
      if (pendingTag && !currentData.tags.includes(pendingTag) && currentData.tags.length < 10) {
        currentData.tags.push(pendingTag);
      }

      saveBtn.textContent = '저장 중...'; saveBtn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/vault`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({
            title: currentData.title,
            area: currentData.area,
            tags: currentData.tags,
            content: currentData.content,
            original: currentData.original,
            source: currentSource,
          }, currentGroup ? { mode: 'append', group: currentGroup } : {}))
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'save failed');
        saveLocally(currentData);
        showToast(currentGroup ? currentGroup + '에 누적됐어요' : 'vault에 저장됐어요');
        hidePreview();
      } catch (e) {
        saveLocally(currentData);
        showToast('로컬 저장됨 (vault 연결 확인 필요)');
        hidePreview();
      } finally { saveBtn.textContent = 'vault에 저장'; saveBtn.disabled = false; }
    });

    discardBtn.addEventListener('click', hidePreview);
    function hidePreview() {
      preview.style.display = 'none';
      currentData = null;
      currentGroup = null;
      textInput.value = '';
    }

    function saveLocally(data) {
      const item = {
        title: data.title,
        area: data.area,
        tags: [...data.tags],
        content: data.content,
        date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
      };
      savedItems.unshift(item);
      if (savedItems.length > 50) savedItems.pop();
      localStorage.setItem('voiceInbox', JSON.stringify(savedItems));
      renderList();
    }

    function renderList() {
      if (savedItems.length === 0) { listLabel.style.display = 'none'; return; }
      listLabel.style.display = 'block';
      savedList.innerHTML = savedItems.slice(0, 10).map(item => {
        const tags = (item.tags || []).slice(0, 4).map(t => `<span class="saved-item-tag">${escapeHtml(t)}</span>`).join('');
        return `
          <div class="saved-item">
            <span class="saved-item-area area-${item.area || '병원'}">${item.area || '병원'}</span>
            <div class="saved-item-text">
              <div class="saved-item-title">${escapeHtml(item.title || '')}</div>
              ${tags ? `<div class="saved-item-tags">${tags}</div>` : ''}
              <div class="saved-item-meta">${item.date || ''}</div>
            </div>
          </div>`;
      }).join('');
    }

    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    renderList();
  </script>
</body>
</html>
